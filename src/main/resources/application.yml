spring:
  application:
    name: spring-ai-agent-demo

  ai:
    model:
      chat: openai
      embedding: zhipuai

    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7

    zhipuai:
      api-key: ${ZHIPU_API_KEY}
      embedding:
        options:
          model: embedding-2

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true

  datasource:
    # 生产环境务必通过环境变量注入 DB_PASSWORD（默认值仅供本地快速启动）
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:rag_db}
    username: ${DB_USERNAME:springai}
    password: ${DB_PASSWORD:springai_rag_2024}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: ${APP_MAX_UPLOAD_MB:20}MB
      max-request-size: ${APP_MAX_UPLOAD_MB:20}MB

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.example.ai: DEBUG
    org.springframework.ai: INFO

app:
  auto-deploy: true
  # 管理端点鉴权 token（环境变量 ADMIN_TOKEN；未设置时仅本机可访问 /api/admin）
  admin-token: ${ADMIN_TOKEN:}
  # 数据根目录（知识库上传目录、生成文件均在此之下）
  data-dir: ${APP_DATA_DIR:/opt/springaitest/data}
  generated-files-dir: ${APP_GEN_FILES_DIR:/opt/springaitest/data/generated-files}
  # 生成文件保留天数，超期自动清理
  gen-files-retention-days: 7
  # 单文件上传上限（MB）
  max-upload-mb: 20
  # AI 接口限流（防费用被刷）
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    per-minute: ${APP_RATE_LIMIT_PER_MINUTE:30}
  # 快模型路由（协调/汇总等结构任务）：开启后 model 可配更便宜的模型
  fast-model: ${APP_FAST_MODEL:deepseek-v4-flash}
  fast-model-enabled: ${APP_FAST_MODEL_ENABLED:false}
  # RAG 知识库功能开关
  rag:
    enabled: true

# ====== 外部 API 配置 ======
api:
  weather:
    # OpenWeatherMap 免费API: https://openweathermap.org/api
    # 免费额度: 1000次/天
    provider: openweathermap
    key: ${WEATHER_API_KEY:}
    base-url: https://api.openweathermap.org/data/2.5
  search:
    # Brave Search API: https://brave.com/search/api/
    # 免费额度: 2000次/月
    provider: brave
    key: ${SEARCH_API_KEY:}
    base-url: https://api.search.brave.com/res/v1/web/search