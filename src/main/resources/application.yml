spring:
  application:
    name: spring-ai-agent-demo

  ai:
    model:
      chat: openai
      embedding: zhipuai

    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7

    zhipuai:
      api-key: ${ZHIPU_API_KEY}
      embedding:
        options:
          model: embedding-2

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:rag_db}
    username: ${DB_USERNAME:springai}
    password: ${DB_PASSWORD:springai_rag_2024}
    driver-class-name: org.postgresql.Driver

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.example.ai: DEBUG
    org.springframework.ai: INFO

app:
  auto-deploy: true