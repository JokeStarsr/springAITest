spring:
  application:
    name: spring-ai-agent-demo

  # OpenAI配置（使用Ollama时注释掉）
  # ai:
  #   openai:
  #     api-key: ${OPENAI_API_KEY}
  #     chat:
  #       options:
  #         model: gpt-3.5-turbo
  #         temperature: 0.7

  # Ollama配置
  ai:
    ollama:
      chat:
        options:
          model: qwen2.5:7b-instruct-q6_K
          temperature: 0.7
      embedding:
        options:
          model: nomic-embed-text
      base-url: http://localhost:11434

server:
  address: 0.0.0.0
  port: 8080

logging:
  level:
    org.example.ai: DEBUG
    org.springframework.ai: DEBUG